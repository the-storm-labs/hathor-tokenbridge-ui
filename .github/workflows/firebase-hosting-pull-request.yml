# Builds every PR and deploys it to a Firebase preview channel.
#
# During the hexagonal migration this is the per-phase verification vehicle: each
# phase must produce a preview that passes docs/smoke-checklist.md before the
# next phase starts.
name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test -- --run
      - name: Build
        run: npm run build
        env:
          VITE_BRIDGE_API_URL: ${{ secrets.VITE_BRIDGE_API_URL }}
          VITE_EVM_HOST_MAINNET: ${{ secrets.VITE_EVM_HOST_MAINNET }}
          VITE_EVM_HOST_TESTNET: ${{ secrets.VITE_EVM_HOST_TESTNET }}
      - name: Fail if env placeholders were not substituted
        run: |
          if grep -rq '%VITE_' public/*.html; then
            echo "::error::Unsubstituted %VITE_*% placeholder in the build output."
            grep -rn '%VITE_' public/*.html
            exit 1
          fi
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HATHOR_BRIDGE_WEBSITE }}
          projectId: hathor-bridge-website
