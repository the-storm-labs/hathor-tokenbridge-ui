# Deploys the Vite build output in public/.
#
# This used to be `mkdir -p public && cp -r src/* public/` with no build step,
# which shipped js/main.js with unresolved bare `@reown/...` imports and the
# literal string %VITE_BRIDGE_API_URL% instead of the API URL. Do not reintroduce
# a copy-based deploy: src/ is source, public/ is build output.
name: Deploy to Firebase Hosting on merge
on:
  push:
    branches: ["main"]
    # Deliberately broad: a change to package.json, vite.config.js, tsconfig.json
    # or to this workflow itself must also trigger a deploy. The previous
    # `src/**`-only filter meant build config changes never shipped.
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "tsconfig.json"
      - "vitest.config.ts"
      - "firebase.json"
      - ".github/workflows/**"
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test -- --run
      - name: Build
        run: npm run build
        env:
          VITE_BRIDGE_API_URL: ${{ secrets.VITE_BRIDGE_API_URL }}
          VITE_EVM_HOST_MAINNET: ${{ secrets.VITE_EVM_HOST_MAINNET }}
          VITE_EVM_HOST_TESTNET: ${{ secrets.VITE_EVM_HOST_TESTNET }}
      - name: Fail if env placeholders were not substituted
        run: |
          if grep -rq '%VITE_' public/*.html; then
            echo "::error::Unsubstituted %VITE_*% placeholder in the build output."
            grep -rn '%VITE_' public/*.html
            exit 1
          fi
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HATHOR_BRIDGE_WEBSITE }}
          channelId: live
          projectId: hathor-bridge-website
